volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

services:
  lb:
    build: .
    entrypoint: ["/lb"]
    ports:
      - "9999:9999"
    environment:
      - UPSTREAMS=/run/sock/api1.sock,/run/sock/api2.sock
      - PORT=9999
    volumes:
      - sock:/run/sock
    networks:
      - fraud-net
    cap_add:
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "6MB"

  api1:
    build: .
    entrypoint: ["/fraud-api"]
    environment:
      - SOCK=/run/sock/api1.sock
    volumes:
      - sock:/run/sock
    networks:
      - fraud-net
    cap_add:
      - SYS_NICE
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "172MB"

  api2:
    build: .
    entrypoint: ["/fraud-api"]
    environment:
      - SOCK=/run/sock/api2.sock
    volumes:
      - sock:/run/sock
    networks:
      - fraud-net
    cap_add:
      - SYS_NICE
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "172MB"

networks:
  fraud-net:
    driver: bridge
