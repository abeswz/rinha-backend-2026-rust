volumes:
  sock:

services:
  nginx:
    image: nginx:alpine
    command: >
      sh -c "until wget -qO- http://api1:3000/ready >/dev/null 2>&1 && wget -qO- http://api2:3000/ready >/dev/null 2>&1; do sleep 1; done && exec nginx -g 'daemon off;'"
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    depends_on:
      - api1
      - api2
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"

  api1:
    build: .
    environment:
      - PORT=3000
      - IVF_NPROBE=24
      - IVF_NPROBE_FAST=2
      - SOCKET_PATH=/run/sock/api1.sock
    volumes:
      - sock:/run/sock
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    build: .
    environment:
      - PORT=3000
      - IVF_NPROBE=24
      - IVF_NPROBE_FAST=2
      - SOCKET_PATH=/run/sock/api2.sock
    volumes:
      - sock:/run/sock
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

networks:
  fraud-net:
    driver: bridge
