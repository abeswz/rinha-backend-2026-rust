services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"

  api1:
    build: .
    environment:
      - PORT=3000
      - IVF_NPROBE=24
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:3000/ready"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"

  api2:
    build: .
    environment:
      - PORT=3000
      - IVF_NPROBE=24
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:3000/ready"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"

networks:
  fraud-net:
    driver: bridge
