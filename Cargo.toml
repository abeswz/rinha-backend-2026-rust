[package]
name = "fraud-detection"
version = "0.1.0"
edition = "2021"

[lib]
name = "fraud_detection"
path = "src/lib.rs"

[[bin]]
name = "fraud-api"
path = "src/main.rs"

[[bin]]
name = "lb"
path = "bin/lb.rs"

[dependencies]
memmap2     = "0.9"
memchr      = "2"
libc        = "0.2"
mimalloc    = { version = "0.1", default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
strip           = true
panic           = "abort"
debug           = 0
overflow-checks = false
incremental     = false

[profile.release.package."*"]
opt-level = 3
