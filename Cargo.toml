[package]
name = "fraud-detection"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fraud-detection"
path = "src/main.rs"

[[bin]]
name = "preprocess"
path = "bin/preprocess.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.3"
chrono = { version = "0.4", features = ["serde"] }
half = "2"
smallvec = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["trace"] }
flate2 = "1"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
axum-test = "20"
once_cell = "1"

[profile.profiling]
inherits = "release"
debug = 1

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
